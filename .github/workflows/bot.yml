name: Run Discord bot

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows use UTC and can be delayed during busy periods.
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: discord-bot-runtime
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot for up to 5 hours 45 minutes
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python -u -c '
          import os
          import subprocess
          import sys

          try:
              subprocess.run(
                  [sys.executable, "-u", "bot.py"],
                  timeout=5 * 60 * 60 + 45 * 60,
                  check=True,
                  env=os.environ.copy(),
              )
          except subprocess.TimeoutExpired:
              print("Scheduled runtime window finished; ending this runner cleanly.")
          '
